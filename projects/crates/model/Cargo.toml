[package]
name = "open-excel-workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workbook model, format conversion, inspection and export for OpenExcel"

[dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "ad76d3060dc8c0e219ba1016f88bf5ab905d48d9", default-features = false }
data-text-csv = { git = "https://github.com/oovm/rust-boost", rev = "ad76d3060dc8c0e219ba1016f88bf5ab905d48d9" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "ad76d3060dc8c0e219ba1016f88bf5ab905d48d9", default-features = false, features = ["xlsx"] }
document-session = { git = "https://github.com/oovm/rust-boost", rev = "ad76d3060dc8c0e219ba1016f88bf5ab905d48d9" }
document-spreadsheet-formula = { git = "https://github.com/oovm/rust-boost", rev = "ad76d3060dc8c0e219ba1016f88bf5ab905d48d9" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
