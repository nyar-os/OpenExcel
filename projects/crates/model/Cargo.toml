[package]
name = "open-excel-workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workbook model, format conversion, inspection and export for OpenExcel"

[dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", default-features = false }
data-binary-zip = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "535fb1f492214bed1fce56657c6d4b3e9b7e127e", default-features = false, features = ["xlsx"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
