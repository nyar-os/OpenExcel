[package]
name = "open-excel-workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workbook model, format conversion, inspection and export for OpenExcel"

[dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7", default-features = false }
data-text-csv = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7", default-features = false, features = ["xlsx"] }
document-session = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
document-spreadsheet-formula = { git = "https://github.com/oovm/rust-boost", rev = "e727187d8c47eda1833f3a63c6528dc463a10ab7" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
