[package]
name = "open-excel-workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workbook model, format conversion, inspection and export for OpenExcel"

[dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26", default-features = false }
data-text-csv = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26", default-features = false, features = ["xlsx"] }
document-session = { git = "https://github.com/oovm/rust-boost", rev = "365f1c9df8f983fa5f5815ec29c770f2241f6d26" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
