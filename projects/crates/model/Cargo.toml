[package]
name = "open-excel-workbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Workbook model, format conversion, inspection and export for OpenExcel"

[dependencies]
boost-fs = { git = "https://github.com/oovm/rust-boost", rev = "4e2d54960c81fd44f9a3d9adb06d5e5c8e2f9a87", default-features = false }
data-text-csv = { git = "https://github.com/oovm/rust-boost", rev = "4e2d54960c81fd44f9a3d9adb06d5e5c8e2f9a87" }
document-formats = { git = "https://github.com/oovm/rust-boost", rev = "4e2d54960c81fd44f9a3d9adb06d5e5c8e2f9a87", default-features = false, features = ["xlsx"] }
document-session = { git = "https://github.com/oovm/rust-boost", rev = "4e2d54960c81fd44f9a3d9adb06d5e5c8e2f9a87" }
document-spreadsheet-formula = { git = "https://github.com/oovm/rust-boost", rev = "4e2d54960c81fd44f9a3d9adb06d5e5c8e2f9a87" }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
